plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.kidcommute'
    compileSdk 32

    defaultConfig {
        applicationId "com.example.kidcommute"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// ------------------------------------------------------------------
// Copy every built APK to the project root (kidCommute2/) after assembly,
// and give it a clear name: kidCommute-debug.apk / kidCommute-release.apk
// ------------------------------------------------------------------
android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        output.outputFileName = "kidCommute-${variant.name}.apk"
    }
    variant.assembleProvider.configure { task ->
        task.doLast {
            copy {
                from { variant.outputs.collect { it.outputFile } }
                into rootProject.projectDir
                include '**/*.apk'
            }
            println "APK copied to ${rootProject.projectDir}"
        }
    }
}

dependencies {

    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation files('libs\\volley.jar')
    implementation files('libs\\picasso-2.5.2.jar')
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}